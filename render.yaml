services:
  - type: web
    name: line-hermes-nutrition-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: hermes-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: TIMEZONE
        value: Asia/Taipei
      - key: DATABASE_PATH
        value: /var/data/hermes.sqlite
      - key: OWNER_DISPLAY_NAME
        value: Jasper
      - key: BASE_URL
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ADMIN_PIN
        sync: false
      - key: LOAD_TEST_SEED_TOKEN
        sync: false
