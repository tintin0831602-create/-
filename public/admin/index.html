<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes 管理員介面</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Hermes Nutrition</p>
          <h1>權限與學員管理</h1>
          <p id="modeLine" class="muted">輸入管理 PIN 後，會自動載入資料庫內所有付費與試用者。</p>
        </div>
        <div class="pin-box">
          <input id="pin" type="password" placeholder="管理 PIN 或教練 PIN" autocomplete="current-password" />
          <button id="refresh" type="button">載入</button>
        </div>
      </header>

      <section class="summary-grid" aria-label="總覽">
        <article>
          <span>總成員</span>
          <strong id="totalUsers">-</strong>
        </article>
        <article>
          <span>啟用中</span>
          <strong id="activeUsers">-</strong>
        </article>
        <article>
          <span>教練</span>
          <strong id="coachUsers">-</strong>
        </article>
        <article>
          <span>近 7 天紀錄</span>
          <strong id="entryCount">-</strong>
        </article>
        <article>
          <span>測試付款額</span>
          <strong id="revenue">-</strong>
        </article>
      </section>

      <nav class="tabs" aria-label="管理分區">
        <button class="tab active" data-tab="overview" type="button">總覽</button>
        <button class="tab" data-tab="people" type="button">成員</button>
        <button class="tab" data-tab="access" type="button">權限</button>
        <button class="tab" data-tab="usage" type="button">使用程度</button>
      </nav>

      <section id="overviewPanel" class="panel-layout tab-panel active">
        <article class="panel hero-panel">
          <div>
            <span>管理焦點</span>
            <h2 id="focusTitle">今天先看誰需要處理</h2>
            <p id="focusText">載入資料後，這裡會整理即將到期、未開通、今日超標與沒有紀錄的成員。</p>
          </div>
          <img src="/assets/feature-coach-dashboard.jpg" alt="教練查看學員營養資料" />
        </article>
        <article class="panel">
          <div class="panel-head">
            <div>
              <span>待處理清單</span>
              <h2>需要注意</h2>
            </div>
          </div>
          <div id="attentionList" class="attention-list"></div>
        </article>
      </section>

      <section id="peoplePanel" class="tab-panel">
        <div class="panel">
          <div class="panel-head">
            <div>
              <span>資料庫成員</span>
              <h2>教練、學員、一般付費者</h2>
            </div>
            <input id="search" type="search" placeholder="搜尋姓名" />
          </div>
          <div id="peopleList" class="people-list"></div>
        </div>
      </section>

      <section id="accessPanel" class="panel-layout tab-panel">
        <article class="panel form-panel">
          <span>授權與續約</span>
          <h2>套用權限</h2>
          <label>成員姓名<input id="grantName" placeholder="例如 小御" /></label>
          <div class="field-grid">
            <label>
              角色
              <select id="grantRole">
                <option value="student">學員 / 一般使用者</option>
                <option value="coach">教練</option>
              </select>
            </label>
            <label>
              權限時間
              <select id="grantDuration">
                <option value="7">7 天試用</option>
                <option value="30">30 天訂閱</option>
                <option value="365">一年訂閱</option>
                <option value="permanent">永久使用</option>
                <option value="disabled">停用</option>
              </select>
            </label>
          </div>
          <label>教練學員名額<input id="studentQuota" type="number" min="0" step="1" value="10" /></label>
          <button id="grant" type="button">套用權限</button>
          <p id="notice" class="notice"></p>
        </article>

        <article class="panel form-panel">
          <span>教練 PIN</span>
          <h2>產生或續約教練</h2>
          <label>教練名稱<input id="coachPinName" placeholder="例如 jasper01" /></label>
          <div class="field-grid">
            <label>
              時間
              <select id="coachPinDuration">
                <option value="7天">7 天</option>
                <option value="30天">30 天</option>
                <option value="一年">一年</option>
              </select>
            </label>
            <label>名額<input id="coachPinQuota" type="number" min="1" step="1" value="10" /></label>
          </div>
          <button id="copyCoachCommand" type="button">產生 LINE 指令</button>
          <p id="coachCommand" class="notice"></p>
        </article>

        <article class="panel form-panel">
          <span>目標設定</span>
          <h2>調整學員數值</h2>
          <label>成員姓名<input id="editName" placeholder="點成員卡會自動帶入" /></label>
          <div class="field-grid">
            <label>熱量<input id="editCalories" type="number" min="1" step="1" /></label>
            <label>蛋白<input id="editProtein" type="number" min="1" step="1" /></label>
            <label>脂質<input id="editFat" type="number" min="1" step="1" /></label>
            <label>碳水<input id="editCarbs" type="number" min="1" step="1" /></label>
          </div>
          <div class="field-grid">
            <label>
              性別
              <select id="editSex">
                <option value="">不修改</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>
            <label>年齡<input id="editAge" type="number" min="1" step="1" /></label>
            <label>身高 cm<input id="editHeight" type="number" min="1" step="0.1" /></label>
            <label>體重 kg<input id="editWeight" type="number" min="1" step="0.1" /></label>
          </div>
          <button id="saveUser" type="button">儲存數值</button>
        </article>
      </section>

      <section id="usagePanel" class="tab-panel">
        <div class="panel">
          <div class="panel-head">
            <div>
              <span>使用程度</span>
              <h2>近 7 天紀錄與付款狀態</h2>
            </div>
            <button id="loadWeek" type="button">查看選取者週回顧</button>
          </div>
          <div id="usageList" class="usage-list"></div>
        </div>
        <div class="panel week-panel">
          <div id="weekSummary" class="week-summary"></div>
          <div id="trend" class="trend"></div>
          <div id="dayPicker" class="day-picker"></div>
          <div id="dayEntries" class="day-entries"></div>
        </div>
      </section>
    </main>
    <script src="/admin/app.js" type="module"></script>
  </body>
</html>
